apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-test-script
data:
  k6-script.js: |
    import http from 'k6/http';
    import { sleep, check } from 'k6';

    export const options = {
      stages: [
        { duration: '30s', target: 20 },
        { duration: '1m',  target: 50 },
        { duration: '30s', target: 0 },
      ],
    };

    export default function () {
      const res = http.get('http://backend-service:8080/api/v1/health');
      check(res, { 'status is 200': (r) => r.status === 200 });
      sleep(0.2);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
spec:
  template:
    metadata:
      labels:
        app: k6-load-test
    spec:
      containers:
      - name: k6
        image: grafana/k6:latest
        command: ["k6", "run", "/scripts/k6-script.js"]
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      restartPolicy: Never
      volumes:
      - name: script-volume
        configMap:
          name: k6-test-script
  backoffLimit: 1