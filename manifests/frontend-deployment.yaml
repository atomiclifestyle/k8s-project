apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: bhuvan-frontend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: NEXT_PUBLIC_API_BASE_URL
          value: "http://backend-service:5000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: bhuvan-secrets
              key: MONGO_URI
        - name: NEXT_PUBLIC_GEOAPIFY_API_KEY
          valueFrom:
            secretKeyRef:
              name: bhuvan-secrets
              key: NEXT_PUBLIC_GEOAPIFY_API_KEY
        - name: ADMIN_USER_ID
          valueFrom:
            secretKeyRef:
              name: bhuvan-secrets
              key: ADMIN_USER_ID
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: bhuvan-secrets
              key: NEXTAUTH_SECRET