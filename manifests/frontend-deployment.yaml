apiVersion: v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: bhuvan-toolkit-frontend:15-4-25-v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000