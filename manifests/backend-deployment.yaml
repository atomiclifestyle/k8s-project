apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:                     
        prometheus.io/scrape: "true" # Allow prometheus to scrape
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics" # Metrics are exposed at this endpoint
    spec:
      containers:
      - name: backend-container
        image: bhuvan-backend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: bhuvan-secrets
              key: MONGO_URI
        - name: NEON_URI
          valueFrom:
            secretKeyRef:
              name: bhuvan-secrets
              key: NEON_URI
        readinessProbe:          # To check the readiness of the server  
          httpGet:
            path: /health          
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5